<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">Best whole-batch latency comparison</title>
  <desc id="desc">For 64 requests with 256 input and 32 output tokens each, UCCL-Lite took 14.72 seconds and NCCL took 15.84 seconds, a 7.1 percent reduction.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #263238; }
    .label { font-size: 15px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 700; fill: white; }
    .tick { font-size: 12px; fill: #63727b; }
  </style>
  <text x="150" y="23" class="label">Whole-batch latency (s, lower is better)</text>
  <rect x="150" y="42" width="396.08" height="36" rx="4" fill="#596775"/>
  <rect x="150" y="93" width="368.04" height="36" rx="4" fill="#087f72"/>
  <text x="15" y="66" class="label">NCCL</text>
  <text x="15" y="117" class="label">UCCL-Lite</text>
  <text x="486" y="66" class="value">15.84</text>
  <text x="458" y="117" class="value">14.72</text>
  <line x1="150" y1="145" x2="550" y2="145" stroke="#9aa7ad"/>
  <g stroke="#9aa7ad">
    <line x1="150" y1="145" x2="150" y2="151"/>
    <line x1="250" y1="145" x2="250" y2="151"/>
    <line x1="350" y1="145" x2="350" y2="151"/>
    <line x1="450" y1="145" x2="450" y2="151"/>
    <line x1="550" y1="145" x2="550" y2="151"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="150" y="168">0</text>
    <text x="250" y="168">4</text>
    <text x="350" y="168">8</text>
    <text x="450" y="168">12</text>
    <text x="550" y="168">16</text>
  </g>
</svg>
